name: Deploy Next.js site to Pages

on:
  push:
    branches: ["master"] # <-- CHANGE THIS TO MASTER
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
      NEXT_PUBLIC_SANITY_DATASET: "production"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Build with Next.js
        run: npx next build
      # Google sign-in helper for the LSD Paper Maker app (shabbiryshakir.github.io/lsd-exampaper-generator).
      # Serving it from this address lets sign-in work inside installed apps on iPhone and Android.
      - name: Add Firebase sign-in helper (/__/auth)
        run: |
          mkdir -p out/__/auth
          base=https://imani-paper-generator.firebaseapp.com/__/auth
          curl -fsSL "$base/handler" -o out/__/auth/handler.html
          curl -fsSL "$base/handler.js" -o out/__/auth/handler.js
          curl -fsSL "$base/experiments.js" -o out/__/auth/experiments.js
          curl -fsSL "$base/iframe" -o out/__/auth/iframe.html
          curl -fsSL "$base/iframe.js" -o out/__/auth/iframe.js
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
